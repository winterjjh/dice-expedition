name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          fi
          ls ~/.local/share/godot/export_templates

      - name: Import project
        run: godot --headless --import --path . 2>&1 | tee import.log || true

      - name: Balance and data check
        run: |
          timeout 600 godot --headless --path . res://tests/sim.tscn 2>&1 | tee sim.log
          if grep -E "SCRIPT ERROR|Parse Error|SIM ERROR" sim.log; then exit 1; fi
          grep -q "SIM OK" sim.log

      - name: UI smoke test
        run: |
          timeout 300 godot --headless --path . res://tests/ui_smoke.tscn 2>&1 | tee ui.log
          if grep -E "SCRIPT ERROR|Parse Error" ui.log; then exit 1; fi
          grep -q "UI OK" ui.log

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/dice-expedition.exe
          cp fonts/Galmuri-OFL.md build/windows/FONT-LICENSE.txt
          ls -la build/windows

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: dice-expedition-windows
          path: build/windows

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: dice-expedition-web
          path: build/web

      - name: Publish web build to web-build branch
        run: |
          cd build/web
          git init -q -b web-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "web build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-build

      - name: Upload Pages artifact
        if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
